[package]
name = "chargekeeper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline Windows battery monitor and charge-policy simulator"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Used directly (not via the Tauri plugins) so that autostart is forced to
# HKCU with a quoted path, and so notification delivery errors are observable.
# Both were already in Cargo.lock as plugin dependencies.
auto-launch = "0.6"
notify-rust = "4.18"
serde.workspace = true
serde_json.workspace = true
chargekeeper-core = { path = "../crates/chargekeeper-core" }
battery = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
